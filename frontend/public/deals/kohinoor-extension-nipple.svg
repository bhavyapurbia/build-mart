<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 200" width="240" height="200">
  <defs>
    <radialGradient id="nippleShadow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#000000" stop-opacity="0.22"/>
      <stop offset="60%" stop-color="#000000" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <!-- Chrome Steel Cylindrical Gradient -->
    <linearGradient id="chromeSteel" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#64748B"/>
      <stop offset="20%" stop-color="#CBD5E1"/>
      <stop offset="40%" stop-color="#FFFFFF"/>
      <stop offset="65%" stop-color="#E2E8F0"/>
      <stop offset="85%" stop-color="#94A3B8"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>
    <!-- Threads highlight gradient -->
    <linearGradient id="threadHighlight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="25%" stop-color="#E2E8F0"/>
      <stop offset="45%" stop-color="#FFFFFF"/>
      <stop offset="70%" stop-color="#94A3B8"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
    <linearGradient id="boreShadow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="60%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#64748B"/>
    </linearGradient>
  </defs>

  <!-- Ground Shadow -->
  <ellipse cx="120" cy="180" rx="48" ry="12" fill="url(#nippleShadow)"/>

  <!-- Main Chrome Cylinder Body -->
  <g id="extension-nipple">
    <!-- Top threaded portion -->
    <!-- Top Rim Oval -->
    <ellipse cx="120" cy="30" rx="38" ry="11" fill="url(#boreShadow)"/>
    <ellipse cx="120" cy="31" rx="32" ry="8" fill="#0F172A"/>

    <!-- Upper Threads -->
    <!-- Thread 1 -->
    <path d="M 82 30 Q 120 38 158 30 L 158 37 Q 120 45 82 37 Z" fill="url(#threadHighlight)"/>
    <!-- Thread 2 -->
    <path d="M 82 36 Q 120 44 158 36 L 158 43 Q 120 51 82 43 Z" fill="url(#threadHighlight)"/>
    <!-- Thread 3 -->
    <path d="M 82 42 Q 120 50 158 42 L 158 49 Q 120 57 82 49 Z" fill="url(#threadHighlight)"/>
    <!-- Thread 4 -->
    <path d="M 82 48 Q 120 56 158 48 L 158 55 Q 120 63 82 55 Z" fill="url(#threadHighlight)"/>
    <!-- Thread 5 -->
    <path d="M 82 54 Q 120 62 158 54 L 158 61 Q 120 69 82 61 Z" fill="url(#threadHighlight)"/>
    <!-- Thread 6 -->
    <path d="M 82 60 Q 120 68 158 60 L 158 67 Q 120 75 82 67 Z" fill="url(#threadHighlight)"/>
    <!-- Thread 7 -->
    <path d="M 82 66 Q 120 74 158 66 L 158 73 Q 120 81 82 73 Z" fill="url(#threadHighlight)"/>
    <!-- Thread 8 -->
    <path d="M 82 72 Q 120 80 158 72 L 158 79 Q 120 87 82 79 Z" fill="url(#threadHighlight)"/>

    <!-- Middle Smooth Polished Chrome Sleeve -->
    <path d="M 81 77 Q 120 85 159 77 L 159 160 Q 120 172 81 160 Z" fill="url(#chromeSteel)"/>

    <!-- Vertical reflections on polished sleeve -->
    <line x1="108" y1="84" x2="108" y2="162" stroke="#FFFFFF" stroke-width="6" stroke-opacity="0.75"/>
    <line x1="126" y1="85" x2="126" y2="163" stroke="#FFFFFF" stroke-width="2" stroke-opacity="0.5"/>
    <line x1="145" y1="83" x2="145" y2="161" stroke="#475569" stroke-width="3" stroke-opacity="0.3"/>

    <!-- Bottom Curved Rim -->
    <path d="M 81 160 Q 120 174 159 160 L 159 165 Q 120 179 81 165 Z" fill="#475569"/>
    <ellipse cx="120" cy="165" rx="39" ry="11" fill="none" stroke="#CBD5E1" stroke-width="1.5"/>
  </g>
</svg>
