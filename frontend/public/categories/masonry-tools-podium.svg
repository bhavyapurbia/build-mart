<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 240" width="280" height="240">
  <defs>
    <linearGradient id="trowelSteel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#94A3B8"/>
    </linearGradient>
    
    <radialGradient id="shadow_trowel" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#000000" stop-opacity="0.18"/>
      <stop offset="70%" stop-color="#000000" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="podiumTop_trowel" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </linearGradient>
  </defs>
  <!-- 3D Pedestal Base -->
  <ellipse cx="140" cy="205" rx="125" ry="25" fill="url(#shadow_trowel)"/>
  <ellipse cx="140" cy="198" rx="115" ry="22" fill="#CBD5E1"/>
  <path d="M 25 198 A 115 22 0 0 0 255 198 L 255 204 A 115 22 0 0 1 25 204 Z" fill="#94A3B8"/>
  <ellipse cx="140" cy="197" rx="114" ry="20" fill="url(#podiumTop_trowel)"/>

  <g transform="translate(60, 50)">
    <!-- Triangular Mason Trowel -->
    <polygon points="80,15 35,95 125,95" fill="url(#trowelSteel)" stroke="#475569" stroke-width="2"/>
    <rect x="74" y="95" width="12" height="22" rx="3" fill="#D97706"/>
    <rect x="70" y="117" width="20" height="30" rx="5" fill="#78350F" stroke="#451A03" stroke-width="1.5"/>
    <!-- Yellow Spirit Level lying flat -->
    <rect x="15" y="125" width="130" height="16" rx="3" fill="#FACC15" stroke="#CA8A04" stroke-width="1.5"/>
    <circle cx="80" cy="133" r="5" fill="#84CC16" stroke="#4D7C0F" stroke-width="1"/>
  </g>
</svg>