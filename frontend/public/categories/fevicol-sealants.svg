<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 240" width="280" height="240">
  <defs>
    <!-- Soft circular podium drop shadow -->
    <radialGradient id="podiumShadow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#000000" stop-opacity="0.18"/>
      <stop offset="70%" stop-color="#000000" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="podiumTop" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </linearGradient>
    <linearGradient id="fevicolLid" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1E40AF"/>
      <stop offset="50%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>
    <linearGradient id="tubBody" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F1F5F9"/>
      <stop offset="40%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </linearGradient>
    <linearGradient id="canYellow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#D97706"/>
      <stop offset="50%" stop-color="#FBBF24"/>
      <stop offset="100%" stop-color="#B45309"/>
    </linearGradient>
  </defs>

  <!-- Ground Shadow -->
  <ellipse cx="140" cy="205" rx="125" ry="25" fill="url(#podiumShadow)"/>

  <!-- Round Studio Podium -->
  <ellipse cx="140" cy="198" rx="115" ry="22" fill="#CBD5E1"/>
  <path d="M 25 198 A 115 22 0 0 0 255 198 L 255 204 A 115 22 0 0 1 25 204 Z" fill="#94A3B8"/>
  <ellipse cx="140" cy="197" rx="114" ry="20" fill="url(#podiumTop)"/>

  <!-- Left Product: Fevicol Marine (Blue Bottle) -->
  <g transform="translate(42, 105)">
    <ellipse cx="26" cy="74" rx="22" ry="6" fill="rgba(0,0,0,0.1)"/>
    <path d="M 8 30 L 14 10 L 38 10 L 44 30 L 48 70 A 24 8 0 0 1 4 70 Z" fill="#1E3A8A"/>
    <ellipse cx="26" cy="10" rx="12" ry="3" fill="#1D4ED8"/>
    <rect x="20" y="2" width="12" height="9" rx="2" fill="#FFFFFF"/>
    <!-- Marine Label -->
    <rect x="10" y="34" width="32" height="28" rx="2" fill="#FFFFFF"/>
    <rect x="12" y="36" width="28" height="6" fill="#1E40AF"/>
    <text x="26" y="41" font-size="4.5" font-family="'Segoe UI', sans-serif" font-weight="900" fill="#FFFFFF" text-anchor="middle">FEVICOL</text>
    <text x="26" y="50" font-size="6" font-family="'Segoe UI', sans-serif" font-weight="900" fill="#1E3A8A" text-anchor="middle">MARINE</text>
    <text x="26" y="58" font-size="3.5" font-family="'Segoe UI', sans-serif" font-weight="800" fill="#D97706" text-anchor="middle">WATERPROOF</text>
  </g>

  <!-- Center Main Product: Fevicol SH Big Tub -->
  <g transform="translate(85, 65)">
    <ellipse cx="55" cy="122" rx="48" ry="12" fill="rgba(0,0,0,0.18)"/>
    <!-- Tub body -->
    <path d="M 12 40 L 20 115 A 35 10 0 0 0 90 115 L 98 40 Z" fill="url(#tubBody)"/>
    <!-- Tub blue lid -->
    <ellipse cx="55" cy="38" rx="46" ry="11" fill="url(#fevicolLid)"/>
    <ellipse cx="55" cy="35" rx="44" ry="9" fill="#2563EB"/>
    <ellipse cx="55" cy="35" rx="24" ry="5" fill="#1D4ED8"/>
    <!-- Yellow band / Pidilite stripe -->
    <path d="M 13 46 L 14 55 A 41 9 0 0 0 96 55 L 97 46 A 42 9 0 0 1 13 46 Z" fill="#F59E0B"/>
    <!-- FEVICOL SH Iconic label -->
    <rect x="24" y="62" width="62" height="44" rx="4" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="0.5"/>
    <!-- Sunset emblem with Elephants -->
    <path d="M 40 80 A 15 15 0 0 1 70 80 Z" fill="#F59E0B"/>
    <circle cx="48" cy="77" r="5" fill="#1E3A8A"/>
    <circle cx="62" cy="77" r="5" fill="#1E3A8A"/>
    <circle cx="55" cy="77" r="3" fill="#FFFFFF"/>
    <text x="55" y="93" font-size="11" font-family="'Impact', 'Arial Black', sans-serif" font-weight="900" fill="#1E3A8A" text-anchor="middle" letter-spacing="0.5">FEVICOL</text>
    <text x="55" y="103" font-size="9" font-family="'Impact', 'Arial Black', sans-serif" font-weight="900" fill="#DC2626" text-anchor="middle">SH</text>
  </g>

  <!-- Right Product 1: Fevicol HeatX Red/Yellow Can -->
  <g transform="translate(178, 98)">
    <ellipse cx="26" cy="84" rx="24" ry="7" fill="rgba(0,0,0,0.12)"/>
    <path d="M 6 22 L 6 80 A 20 6 0 0 0 46 80 L 46 22 Z" fill="url(#canYellow)"/>
    <ellipse cx="26" cy="22" rx="20" ry="6" fill="#FBBF24"/>
    <rect x="20" y="14" width="12" height="9" rx="1.5" fill="#DC2626"/>
    <!-- HeatX label -->
    <rect x="9" y="34" width="34" height="36" fill="#DC2626"/>
    <text x="26" y="44" font-size="4.5" font-family="'Segoe UI', sans-serif" font-weight="900" fill="#FFFFFF" text-anchor="middle">FEVICOL</text>
    <text x="26" y="55" font-size="7.5" font-family="'Impact', 'Arial Black', sans-serif" font-weight="900" fill="#FEF08A" text-anchor="middle">HEATX</text>
    <text x="26" y="64" font-size="4" font-family="'Segoe UI', sans-serif" font-weight="800" fill="#FFFFFF" text-anchor="middle">FAST GRIP</text>
  </g>

  <!-- Right Product 2: Small Tube (Fevikwik / Hi-Per) -->
  <g transform="translate(216, 115)">
    <path d="M 6 35 L 8 68 A 12 4 0 0 0 26 68 L 28 35 Z" fill="#FFFFFF"/>
    <ellipse cx="17" cy="35" rx="11" ry="3.5" fill="#E2E8F0"/>
    <rect x="13" y="24" width="8" height="12" rx="1" fill="#EA580C"/>
    <rect x="8" y="42" width="18" height="18" fill="#EA580C"/>
    <text x="17" y="54" font-size="5" font-family="'Impact', sans-serif" font-weight="900" fill="#FFFFFF" text-anchor="middle">HI-PER</text>
  </g>
</svg>
