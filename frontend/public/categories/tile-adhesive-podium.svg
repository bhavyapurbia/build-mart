<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 240" width="280" height="240">
  <defs>
    <linearGradient id="roffBag" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284C7"/>
      <stop offset="60%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#0369A1"/>
    </linearGradient>
    
    <radialGradient id="shadow_adh" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#000000" stop-opacity="0.18"/>
      <stop offset="70%" stop-color="#000000" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="podiumTop_adh" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </linearGradient>
  </defs>
  <!-- 3D Pedestal Base -->
  <ellipse cx="140" cy="205" rx="125" ry="25" fill="url(#shadow_adh)"/>
  <ellipse cx="140" cy="198" rx="115" ry="22" fill="#CBD5E1"/>
  <path d="M 25 198 A 115 22 0 0 0 255 198 L 255 204 A 115 22 0 0 1 25 204 Z" fill="#94A3B8"/>
  <ellipse cx="140" cy="197" rx="114" ry="20" fill="url(#podiumTop_adh)"/>

  <g transform="translate(75, 45)">
    <!-- Roff 20kg Sack -->
    <polygon points="20,15 90,15 105,145 5,145" fill="url(#roffBag)" stroke="#0369A1" stroke-width="2"/>
    <polygon points="20,15 90,15 85,25 25,25" fill="#E0F2FE"/>
    <!-- Yellow band -->
    <rect x="12" y="55" width="86" height="32" fill="#FACC15"/>
    <text x="55" y="72" font-family="Arial, sans-serif" font-size="12" font-weight="900" fill="#1E293B" text-anchor="middle">ROFF</text>
    <text x="55" y="83" font-family="Arial, sans-serif" font-size="8" font-weight="800" fill="#0369A1" text-anchor="middle">TILE ADHESIVE</text>
    <!-- 20 kg pill -->
    <rect x="35" y="105" width="40" height="16" rx="8" fill="#FFFFFF"/>
    <text x="55" y="116" font-family="Arial, sans-serif" font-size="9" font-weight="900" fill="#0284C7" text-anchor="middle">20 KG</text>
  </g>
</svg>