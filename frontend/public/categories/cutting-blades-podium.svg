<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 240" width="280" height="240">
  <defs>
    <linearGradient id="bladeSilver" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="40%" stop-color="#CBD5E1"/>
      <stop offset="70%" stop-color="#94A3B8"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>
    
    <radialGradient id="shadow_blade" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#000000" stop-opacity="0.18"/>
      <stop offset="70%" stop-color="#000000" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="podiumTop_blade" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </linearGradient>
  </defs>
  <!-- 3D Pedestal Base -->
  <ellipse cx="140" cy="205" rx="125" ry="25" fill="url(#shadow_blade)"/>
  <ellipse cx="140" cy="198" rx="115" ry="22" fill="#CBD5E1"/>
  <path d="M 25 198 A 115 22 0 0 0 255 198 L 255 204 A 115 22 0 0 1 25 204 Z" fill="#94A3B8"/>
  <ellipse cx="140" cy="197" rx="114" ry="20" fill="url(#podiumTop_blade)"/>

  <g transform="translate(75, 45)">
    <!-- Continuous rim 4-inch diamond circular blade -->
    <circle cx="65" cy="75" r="58" fill="url(#bladeSilver)" stroke="#0284C7" stroke-width="4"/>
    <circle cx="65" cy="75" r="48" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
    <circle cx="65" cy="75" r="14" fill="#64748B"/>
    <circle cx="65" cy="75" r="9" fill="#F8FAFC"/>
    <text x="65" y="65" font-family="Arial, sans-serif" font-size="7" font-weight="900" fill="#0284C7" text-anchor="middle">4 INCH</text>
    <text x="65" y="92" font-family="Arial, sans-serif" font-size="6" font-weight="800" fill="#64748B" text-anchor="middle">MARBLE CUTTER</text>
  </g>
</svg>