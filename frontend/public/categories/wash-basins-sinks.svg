<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 240" width="280" height="240">
  <defs>
    <radialGradient id="basinShadow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#000000" stop-opacity="0.18"/>
      <stop offset="70%" stop-color="#000000" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="podiumTop7" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </linearGradient>
    <linearGradient id="ceramicBowl" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E2E8F0"/>
      <stop offset="40%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#CBD5E1"/>
    </linearGradient>
    <linearGradient id="stainlessSink" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E2E8F0"/>
      <stop offset="50%" stop-color="#94A3B8"/>
      <stop offset="100%" stop-color="#64748B"/>
    </linearGradient>
  </defs>

  <ellipse cx="140" cy="205" rx="125" ry="25" fill="url(#basinShadow)"/>
  <ellipse cx="140" cy="198" rx="115" ry="22" fill="#CBD5E1"/>
  <path d="M 25 198 A 115 22 0 0 0 255 198 L 255 204 A 115 22 0 0 1 25 204 Z" fill="#94A3B8"/>
  <ellipse cx="140" cy="197" rx="114" ry="20" fill="url(#podiumTop7)"/>

  <!-- Back Left: Stainless Steel Kitchen Sink with Drainboard -->
  <g transform="translate(42, 60)">
    <polygon points="10,40 130,20 145,95 25,115" fill="url(#stainlessSink)"/>
    <!-- Sink Basin Depth -->
    <polygon points="20,45 80,35 88,98 28,108" fill="#475569"/>
    <ellipse cx="54" cy="72" rx="28" ry="16" fill="#334155"/>
    <circle cx="54" cy="72" r="7" fill="#CBD5E1"/>
    <!-- Drainboard grooves -->
    <line x1="90" y1="44" x2="132" y2="38" stroke="#CBD5E1" stroke-width="2"/>
    <line x1="93" y1="56" x2="135" y2="50" stroke="#CBD5E1" stroke-width="2"/>
    <line x1="96" y1="68" x2="138" y2="62" stroke="#CBD5E1" stroke-width="2"/>
  </g>

  <!-- Front Center: Sleek Ceramic Table-Top Vanity Basin -->
  <g transform="translate(100, 95)">
    <ellipse cx="50" cy="94" rx="46" ry="12" fill="rgba(0,0,0,0.18)"/>
    <!-- Basin outer curved bowl -->
    <path d="M 6 40 C 6 85, 94 85, 94 40 Z" fill="url(#ceramicBowl)"/>
    <!-- Basin inner rim -->
    <ellipse cx="50" cy="40" rx="44" ry="18" fill="#F8FAFC"/>
    <ellipse cx="50" cy="40" rx="38" ry="14" fill="#E2E8F0"/>
    <ellipse cx="50" cy="42" rx="34" ry="11" fill="#FFFFFF"/>
    <!-- Center chrome pop-up waste coupling -->
    <circle cx="50" cy="43" r="6" fill="#94A3B8"/>
    <circle cx="50" cy="43" r="4" fill="#E2E8F0"/>
    <!-- Faucet mounted on basin back -->
    <rect x="46" y="10" width="8" height="22" rx="2" fill="#94A3B8"/>
    <path d="M 46 10 C 46 0, 64 0, 64 16 L 58 16 C 58 6, 52 6, 52 10 Z" fill="#CBD5E1"/>
  </g>
</svg>
