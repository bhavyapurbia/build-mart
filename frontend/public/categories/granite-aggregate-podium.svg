<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 240" width="280" height="240">
  <defs>
    <linearGradient id="graniteStone" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#94A3B8"/>
      <stop offset="50%" stop-color="#475569"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
    
    <radialGradient id="shadow_agg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#000000" stop-opacity="0.18"/>
      <stop offset="70%" stop-color="#000000" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="podiumTop_agg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </linearGradient>
  </defs>
  <!-- 3D Pedestal Base -->
  <ellipse cx="140" cy="205" rx="125" ry="25" fill="url(#shadow_agg)"/>
  <ellipse cx="140" cy="198" rx="115" ry="22" fill="#CBD5E1"/>
  <path d="M 25 198 A 115 22 0 0 0 255 198 L 255 204 A 115 22 0 0 1 25 204 Z" fill="#94A3B8"/>
  <ellipse cx="140" cy="197" rx="114" ry="20" fill="url(#podiumTop_agg)"/>

  <g transform="translate(65, 70)">
    <!-- Angular stones cluster -->
    <polygon points="25,95 45,75 60,88 50,110 30,105" fill="url(#graniteStone)"/>
    <polygon points="55,80 80,60 95,78 85,100 60,95" fill="url(#graniteStone)"/>
    <polygon points="90,75 115,55 130,75 120,95 95,90" fill="url(#graniteStone)"/>
    <polygon points="40,110 70,100 85,120 55,130" fill="url(#graniteStone)"/>
    <polygon points="75,105 105,95 120,115 90,125" fill="url(#graniteStone)"/>
    <text x="75" y="145" font-family="Arial, sans-serif" font-size="10" font-weight="900" fill="#1E293B" text-anchor="middle">20mm BLUE METAL</text>
  </g>
