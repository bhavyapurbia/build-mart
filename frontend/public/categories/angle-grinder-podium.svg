<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 240" width="280" height="240">
  <defs>
    <linearGradient id="boschBlue" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0284C7"/>
      <stop offset="100%" stop-color="#0369A1"/>
    </linearGradient>
    
    <radialGradient id="shadow_grind" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#000000" stop-opacity="0.18"/>
      <stop offset="70%" stop-color="#000000" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="podiumTop_grind" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </linearGradient>
  </defs>
  <!-- 3D Pedestal Base -->
  <ellipse cx="140" cy="205" rx="125" ry="25" fill="url(#shadow_grind)"/>
  <ellipse cx="140" cy="198" rx="115" ry="22" fill="#CBD5E1"/>
  <path d="M 25 198 A 115 22 0 0 0 255 198 L 255 204 A 115 22 0 0 1 25 204 Z" fill="#94A3B8"/>
  <ellipse cx="140" cy="197" rx="114" ry="20" fill="url(#podiumTop_grind)"/>

  <g transform="translate(50, 55)">
    <!-- Main cylindrical body -->
    <rect x="75" y="45" width="95" height="35" rx="10" fill="url(#boschBlue)" transform="rotate(-20 75 45)"/>
    <!-- Head gearbox -->
    <circle cx="65" cy="100" r="28" fill="#475569" stroke="#1E293B" stroke-width="2"/>
    <!-- Wheel guard -->
    <path d="M 40 100 A 35 35 0 0 1 85 70" fill="none" stroke="#0F172A" stroke-width="12"/>
    <!-- Cutting disc rim -->
    <ellipse cx="65" cy="115" rx="35" ry="12" fill="#E2E8F0" stroke="#CBD5E1" stroke-width="2"/>
    <text x="125" y="65" font-family="Arial, sans-serif" font-size="8" font-weight="900" fill="#FFFFFF" transform="rotate(-20 125 65)">BOSCH 670W</text>
  </g>
</svg>