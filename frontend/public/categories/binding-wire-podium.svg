<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 240" width="280" height="240">
  <defs>
    <linearGradient id="wireDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#64748B"/>
      <stop offset="50%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    
    <radialGradient id="shadow_wire" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#000000" stop-opacity="0.18"/>
      <stop offset="70%" stop-color="#000000" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="podiumTop_wire" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </linearGradient>
  </defs>
  <!-- 3D Pedestal Base -->
  <ellipse cx="140" cy="205" rx="125" ry="25" fill="url(#shadow_wire)"/>
  <ellipse cx="140" cy="198" rx="115" ry="22" fill="#CBD5E1"/>
  <path d="M 25 198 A 115 22 0 0 0 255 198 L 255 204 A 115 22 0 0 1 25 204 Z" fill="#94A3B8"/>
  <ellipse cx="140" cy="197" rx="114" ry="20" fill="url(#podiumTop_wire)"/>

  <g transform="translate(60, 60)">
    <!-- Wire roll coil (torus look) -->
    <ellipse cx="80" cy="95" rx="55" ry="32" fill="none" stroke="url(#wireDark)" stroke-width="22"/>
    <ellipse cx="80" cy="95" rx="55" ry="32" fill="none" stroke="#94A3B8" stroke-width="2" stroke-dasharray="4,4"/>
    <ellipse cx="80" cy="95" rx="35" ry="20" fill="url(#podiumTop_wire)"/>
    <!-- Annealed wire ties -->
    <path d="M 50 80 Q 75 40 110 70" stroke="#475569" stroke-width="3" fill="none"/>
    <text x="80" y="100" font-family="Arial, sans-serif" font-size="9" font-weight="900" fill="#0F172A" text-anchor="middle">18 GAUGE</text>
  </g>
</svg>