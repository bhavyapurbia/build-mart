<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 240" width="280" height="240">
  <defs>
    <radialGradient id="cementShadow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#000000" stop-opacity="0.2"/>
      <stop offset="70%" stop-color="#000000" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="podiumTop4" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </linearGradient>
    <linearGradient id="ultraYellow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="35%" stop-color="#FDE047"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
    <linearGradient id="ramcoBag" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FEF3C7"/>
      <stop offset="40%" stop-color="#FFFBEB"/>
      <stop offset="100%" stop-color="#FDE68A"/>
    </linearGradient>
    <linearGradient id="birlaBag" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E2E8F0"/>
      <stop offset="40%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#CBD5E1"/>
    </linearGradient>
  </defs>

  <!-- Ground Shadow -->
  <ellipse cx="140" cy="205" rx="125" ry="25" fill="url(#cementShadow)"/>

  <!-- Round Studio Podium -->
  <ellipse cx="140" cy="198" rx="115" ry="22" fill="#CBD5E1"/>
  <path d="M 25 198 A 115 22 0 0 0 255 198 L 255 204 A 115 22 0 0 1 25 204 Z" fill="#94A3B8"/>
  <ellipse cx="140" cy="197" rx="114" ry="20" fill="url(#podiumTop4)"/>

  <!-- Left Bag: Ramco Supergrade -->
  <g transform="translate(38, 70)">
    <ellipse cx="34" cy="118" rx="30" ry="8" fill="rgba(0,0,0,0.12)"/>
    <path d="M 6 12 Q 34 8 62 10 L 66 114 Q 34 118 4 114 Z" fill="url(#ramcoBag)"/>
    <!-- Top & bottom stitched border -->
    <line x1="6" y1="14" x2="62" y2="12" stroke="#DC2626" stroke-width="1.5" stroke-dasharray="2,2"/>
    <line x1="4" y1="112" x2="66" y2="112" stroke="#DC2626" stroke-width="1.5" stroke-dasharray="2,2"/>
    <!-- Red diamond logo -->
    <polygon points="34,26 48,40 34,54 20,40" fill="#DC2626"/>
    <text x="34" y="44" font-size="8" font-family="'Segoe UI', sans-serif" font-weight="900" fill="#FFFFFF" text-anchor="middle">R</text>
    <text x="34" y="66" font-size="7" font-family="'Impact', sans-serif" font-weight="900" fill="#DC2626" text-anchor="middle">RAMCO</text>
    <text x="34" y="74" font-size="4" font-family="'Segoe UI', sans-serif" font-weight="800" fill="#1E3A8A" text-anchor="middle">SUPERGRADE</text>
    <text x="34" y="90" font-size="4" font-family="'Segoe UI', sans-serif" font-weight="700" fill="#4B5563" text-anchor="middle">50 KG PPC</text>
  </g>

  <!-- Center Big Bag: UltraTech Cement (Iconic Yellow Bag with U logo) -->
  <g transform="translate(95, 52)">
    <ellipse cx="45" cy="138" rx="42" ry="11" fill="rgba(0,0,0,0.2)"/>
    <path d="M 6 12 Q 45 6 84 10 L 88 134 Q 45 140 4 134 Z" fill="url(#ultraYellow)"/>
    <!-- Stitched rims -->
    <line x1="6" y1="14" x2="84" y2="12" stroke="#18181B" stroke-width="2" stroke-dasharray="3,2"/>
    <line x1="4" y1="132" x2="88" y2="132" stroke="#18181B" stroke-width="2" stroke-dasharray="3,2"/>
    <!-- Black and Yellow UltraTech Emblem -->
    <rect x="22" y="28" width="46" height="42" rx="4" fill="#18181B"/>
    <text x="45" y="58" font-size="28" font-family="'Impact', 'Arial Black', sans-serif" font-weight="900" fill="#FDE047" text-anchor="middle">U</text>
    <text x="45" y="84" font-size="9" font-family="'Arial Black', sans-serif" font-weight="900" fill="#18181B" text-anchor="middle">UltraTech</text>
    <text x="45" y="96" font-size="8.5" font-family="'Arial Black', sans-serif" font-weight="900" fill="#B45309" text-anchor="middle">CEMENT</text>
    <text x="45" y="106" font-size="4.5" font-family="'Segoe UI', sans-serif" font-weight="800" fill="#18181B" text-anchor="middle">The Engineer's Choice</text>
    <rect x="24" y="112" width="42" height="12" fill="#18181B" rx="2"/>
    <text x="45" y="121" font-size="6" font-family="'Segoe UI', sans-serif" font-weight="900" fill="#FFFFFF" text-anchor="middle">SUPER PPC</text>
  </g>

  <!-- Right Bag: Birla Super Cement -->
  <g transform="translate(178, 72)">
    <ellipse cx="32" cy="116" rx="28" ry="8" fill="rgba(0,0,0,0.12)"/>
    <path d="M 4 12 Q 32 8 60 10 L 64 112 Q 32 116 2 112 Z" fill="url(#birlaBag)"/>
    <line x1="4" y1="14" x2="60" y2="12" stroke="#0284C7" stroke-width="1.5" stroke-dasharray="2,2"/>
    <line x1="2" y1="110" x2="64" y2="110" stroke="#0284C7" stroke-width="1.5" stroke-dasharray="2,2"/>
    <rect x="14" y="26" width="36" height="28" fill="#0284C7" rx="3"/>
    <text x="32" y="44" font-size="14" font-family="'Impact', sans-serif" font-weight="900" fill="#FFFFFF" text-anchor="middle">B</text>
    <text x="32" y="68" font-size="7" font-family="'Arial Black', sans-serif" font-weight="900" fill="#0284C7" text-anchor="middle">BIRLA</text>
    <text x="32" y="76" font-size="5" font-family="'Segoe UI', sans-serif" font-weight="800" fill="#DC2626" text-anchor="middle">SUPER 53</text>
    <text x="32" y="90" font-size="4" font-family="'Segoe UI', sans-serif" font-weight="700" fill="#4B5563" text-anchor="middle">50 KG NETT</text>
  </g>
</svg>
