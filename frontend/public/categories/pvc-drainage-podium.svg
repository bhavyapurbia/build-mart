<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 240" width="280" height="240">
  <defs>
    <linearGradient id="pvcGray" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#94A3B8"/>
      <stop offset="35%" stop-color="#E2E8F0"/>
      <stop offset="70%" stop-color="#94A3B8"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>
    
    <radialGradient id="shadow_pvc" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#000000" stop-opacity="0.18"/>
      <stop offset="70%" stop-color="#000000" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="podiumTop_pvc" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </linearGradient>
  </defs>
  <!-- 3D Pedestal Base -->
  <ellipse cx="140" cy="205" rx="125" ry="25" fill="url(#shadow_pvc)"/>
  <ellipse cx="140" cy="198" rx="115" ry="22" fill="#CBD5E1"/>
  <path d="M 25 198 A 115 22 0 0 0 255 198 L 255 204 A 115 22 0 0 1 25 204 Z" fill="#94A3B8"/>
  <ellipse cx="140" cy="197" rx="114" ry="20" fill="url(#podiumTop_pvc)"/>

  <g transform="translate(60, 45)">
    <!-- SWR PVC Pipe upright -->
    <rect x="35" y="10" width="46" height="145" rx="6" fill="url(#pvcGray)"/>
    <!-- Socket end (ring fit) -->
    <rect x="30" y="20" width="56" height="18" rx="4" fill="#64748B" stroke="#334155" stroke-width="1.5"/>
    <rect x="33" y="24" width="50" height="10" rx="2" fill="#CBD5E1"/>
    <!-- SWR 110mm text -->
    <text x="58" y="90" font-family="Arial, sans-serif" font-size="10" font-weight="900" fill="#334155" transform="rotate(-90 58 90)">SWR 110mm</text>
    <!-- PVC 90deg bend fitting on right -->
    <path d="M 85 110 Q 140 110 140 165 L 115 165 Q 115 135 85 135 Z" fill="url(#pvcGray)" stroke="#475569" stroke-width="2"/>
    <ellipse cx="85" cy="122.5" rx="6" ry="12.5" fill="#64748B"/>
    <ellipse cx="127.5" cy="165" rx="12.5" ry="6" fill="#64748B"/>
  </g>
</svg>