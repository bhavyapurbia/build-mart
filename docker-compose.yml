version: '3.8'

services:
  mongo:
    image: mongo:7.0
    container_name: buildmart-mongo
    command: ["--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: mongosh --eval "try { rs.status().ok } catch(e) { rs.initiate().ok }" || exit 1
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: buildmart-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
    restart: unless-stopped

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: buildmart-api
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - CLIENT_URL=http://localhost,http://localhost:80,http://localhost:5173
      - MONGODB_URI=mongodb://mongo:27017/buildmart?replicaSet=rs0
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=prod_secret_buildmart_construction_portal_2026_secure_key
      - JWT_ACCESS_TTL=15m
      - REFRESH_TTL_DAYS=30
      - TRUST_PROXY=1
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: buildmart-worker
    command: ["npm", "run", "worker"]
    environment:
      - NODE_ENV=production
      - MONGODB_URI=mongodb://mongo:27017/buildmart?replicaSet=rs0
      - REDIS_URL=redis://redis:6379
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: buildmart-web
    ports:
      - "80:80"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  mongo-data:
  redis-data:

