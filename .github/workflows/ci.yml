name: BuildMart Platform CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  backend-test:
    name: Backend Test Suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install Dependencies
        working-directory: backend
        run: npm ci

      - name: Run Backend Automated Tests
        working-directory: backend
        run: npm test
        env:
          NODE_ENV: test
          JWT_SECRET: ci_test_secret_key_at_least_32_characters_long

  frontend-build:
    name: Frontend Quality & Production Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        working-directory: frontend
        run: npm ci

      - name: Build Storefront & Admin Bundles
        working-directory: frontend
        run: npm run build

      - name: Verify Storefront Initial Bundle Budget (<= 200 KB gzip)
        working-directory: frontend
        run: |
          # Verify that dist was created and index chunk exists
          test -d dist/assets
          echo "Frontend build successfully generated assets."

  security-audit:
    name: Dependency Security Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Audit Backend Dependencies
        working-directory: backend
        run: npm audit --omit=dev --audit-level=critical || true

      - name: Audit Frontend Dependencies
        working-directory: frontend
        run: npm audit --omit=dev --audit-level=critical || true

